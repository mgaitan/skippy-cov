name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  UV_MALWARE_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv run --only-group lint ruff check --output-format=github
      - run: uv run --only-group lint ruff format --check
      - run: uv run --group qa ty check skippy_cov --output-format=github

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Configure git for integration tests
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - run: uv run --no-default-groups --group test pytest --cov --cov-context=test --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Smoke test built wheel outside the source tree
        run: |
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" skippy-cov --version
          uv run --isolated --no-project --with "$wheel" --with pytest pytest --help | grep -- --skippy-cov
