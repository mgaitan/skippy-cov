[project]
name = "skippy-cov"
version = "0.3.0"
description = "Selectively run tests based on the current git diff and the collected data from previous tests runs"
authors = [
    { name = "Mariano Garcia Berrotaran", email = "mariano.garciaberrotaran@shiphero.com" },
    { name = "Martín Gaitán", email = "marting@shiphero.com" },
]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<3.16"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "unidiff >=0.7.5",
    "coverage>=7.9",
]
scripts = { "skippy-cov" = "skippy_cov.__main__:main" }

[project.urls]
Repository = "https://github.com/mgaitan/skippy-cov"
Issues = "https://github.com/mgaitan/skippy-cov/issues"
Changelog = "https://github.com/mgaitan/skippy-cov/releases"

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-mock>=3.15.1", "pytest-cov>=7.1.0"]
lint = ["ruff>=0.17.1"]
qa = [{ include-group = "lint" }, "ty>=0.0.90", "types-unidiff"]
dev = [{ include-group = "test" }, { include-group = "qa" }]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skippy_cov"
module-root = ""
source-include = ["tests/**", "CONTRIBUTING.md", "Makefile", "uv.lock", "prek.toml"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { ruff = "0 days", ty = "0 days" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    "S607",
    "S603",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
core = "ctrace"
source = ["skippy_cov"]

[project.entry-points.pytest11]
skippy-cov = "skippy_cov.plugin"
